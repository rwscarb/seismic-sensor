display_information:
  name: Seismic Sensor
  description: Real-time P-wave detection and USGS earthquake correlation from the Portland Pi.
  background_color: "#0d1117"

features:
  bot_user:
    display_name: seismic-sensor
    always_online: false
  slash_commands:
    - command: /seismic
      url: https://seismic-sensor.fly.dev/slack/command
      description: Query the seismic sensor
      usage_hint: "[status | recent [N] | usgs | help]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - incoming-webhook

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
